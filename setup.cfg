[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-html-dir=cover

[coverage:report]
show_missing = True

[flake8]
max-line-length=100
exclude=.git,__pycache__,venv,.venv,*.egg-info

[pylint]
max-line-length=100
disable=
    C0114,
    C0115,
    C0116,
    R0903,
    W0212
